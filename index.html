<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Paper Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stone paper scessor</h1>
    <div class="choices">
        <div class="choice" id="stone">
            <img src="https://www.pngitem.com/pimgs/m/226-2260873_transparent-rock-paper-scissors-png-png-download.png" alt="stone">

        </div>
        <div class="choice" id="paper">
            <img src="https://www.pngitem.com/pimgs/m/266-2667795_rock-paper-scissors-png-transparent-png.png" alt="paper">

        </div>
        <div class="choice" id="scissor">
            <img src="https://c8.alamy.com/comp/P9GE1B/stone-paper-scissors-hand-P9GE1B.jpg" alt="scissor">

        </div>
        <div class="score-board">
            <div class="score">
                <p id="user-score">0</p>
                <p>you</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>comp</p>
            </div>
        </div>
        <div class="msg-container">
            <p id="msg">play your move</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
